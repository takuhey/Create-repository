    --gold-dim:#8a7440;
    --income:#5FBE95;
    --cash:#C98A4B;
    --card:#7B93C9;
    --danger:#C1524A;
    --fixed:#9B8ACB;
  }
  *{box-sizing:border-box;}
  html, body{ touch-action:manipulation; -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #1a2130 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Segoe UI', sans-serif;
    min-height:100vh;
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
  }
  .mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-variant-numeric:tabular-nums;}
  .serif{font-family:'Hiragino Mincho ProN', 'Yu Mincho', serif;}

  #app{max-width:640px; margin:0 auto; padding:20px 16px 40px;}

  header.app-header{
    display:flex; align-items:flex-end; justify-content:space-between;
    padding:8px 4px 20px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:18px;
  }
  header.app-header h1{
    font-size:22px; margin:0; font-weight:700; letter-spacing:.04em;
  }
  header.app-header .sub{font-size:11px; color:var(--text-dim); margin-top:4px; letter-spacing:.08em;}

  .balance-box{text-align:right;}
  .balance-box .label{font-size:11px; color:var(--text-dim); letter-spacing:.1em;}
  .balance-box .amount{font-size:26px; font-weight:600; color:var(--gold); line-height:1.3;}

  nav.tabs{display:flex; gap:4px; margin-bottom:18px; background:var(--surface); border-radius:10px; padding:4px; border:1px solid var(--border-soft); overflow-x:auto; -webkit-overflow-scrolling:touch;}
  nav.tabs button{
    flex:1 0 auto; padding:9px 10px; background:transparent; border:none; color:var(--text-dim);
    font-family:inherit; font-size:13px; font-weight:500; border-radius:7px; cursor:pointer;
    transition:background .15s, color .15s; white-space:nowrap;
  }
  nav.tabs button.active{background:var(--surface2); color:var(--gold); box-shadow:inset 0 0 0 1px var(--border);}

  .chip-picker{display:flex; flex-wrap:wrap; gap:7px;}
  .chip-picker button{
    padding:7px 13px; background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:20px; font-family:inherit; font-size:12.5px; cursor:pointer;
  }
  .chip-picker button.sel{background:var(--gold); color:#1b1508; border-color:var(--gold); font-weight:700;}

  .cat-chip{
    display:inline-flex; align-items:center; gap:6px; padding:6px 6px 6px 13px; background:var(--surface2);
    border:1px solid var(--border); border-radius:20px; font-size:12.5px; margin:0 7px 7px 0;
  }
  .cat-chip button{
    background:none; border:none; color:var(--text-dim); font-size:14px; line-height:1; cursor:pointer; padding:2px 4px;
  }
  .cat-chip button:hover{color:var(--danger);}

  .panel{display:none; animation:fadein .2s ease;}
  .panel.active{display:block;}
  @keyframes fadein{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);}}

  .card-surface{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:12px;
    padding:16px; margin-bottom:14px;
  }

  .month-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .month-nav button{
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:15px;
  }
  .month-nav .month-label{font-size:16px; font-weight:700; letter-spacing:.03em;}

  .btn-primary{
    background:linear-gradient(180deg, #d8b869, var(--gold));
    color:#1b1508; border:none; font-weight:700; padding:11px 16px; border-radius:9px;
    cursor:pointer; font-family:inherit; font-size:14px; width:100%;
    box-shadow:0 2px 0 var(--gold-dim);
  }
  .btn-primary:active{transform:translateY(1px); box-shadow:none;}
  .btn-secondary{
    background:var(--surface2); color:var(--text); border:1px solid var(--border);
    padding:10px 14px; border-radius:9px; cursor:pointer; font-family:inherit; font-size:13px;
  }
  .btn-text{background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer; text-decoration:underline;}
  .btn-danger-text{background:none; border:none; color:var(--danger); font-size:12px; cursor:pointer;}

  /* ledger rows — passbook style with perforated left edge */
  .ledger{border-left:2px dashed var(--border); padding-left:14px;}
  .row{
    position:relative; padding:11px 0; border-bottom:1px solid var(--border-soft);
    display:flex; align-items:center; gap:10px;
  }
  .row:last-child{border-bottom:none;}
  .row::before{
    content:''; position:absolute; left:-19px; top:50%; transform:translateY(-50%);
    width:7px; height:7px; border-radius:50%; background:var(--border); border:2px solid var(--bg);
  }
  .row.future::before{background:var(--card);}
  .row .date-col{width:48px; flex-shrink:0; font-size:12px; color:var(--text-dim); line-height:1.3;}
  .row .date-col .wd{font-size:10px;}
  .row .mid{flex:1; min-width:0;}
  .row .memo{font-size:14px; font-weight:500; display:block; margin-top:4px;}
  .row .tag{
    display:inline-block; font-size:10px; padding:1px 7px; border-radius:20px; margin-right:6px;
    letter-spacing:.03em; vertical-align:middle;
  }
  .tag.cash{background:rgba(201,138,75,.18); color:var(--cash);}
  .tag.income{background:rgba(95,190,149,.18); color:var(--income);}
  .tag.card{background:rgba(123,147,201,.18); color:var(--card);}
  .tag.fixed{background:rgba(155,138,203,.2); color:var(--fixed); margin-left:4px;}
  .row .sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .row .detail-toggle{
    font-size:11px; color:var(--gold); margin-top:2px; display:inline-block; cursor:pointer;
  }
  .row .detail-box{
    margin-top:6px; padding:8px 10px; background:var(--surface2); border-left:2px solid var(--gold);
    border-radius:6px; font-size:12px; color:var(--text-dim); white-space:pre-wrap; line-height:1.5;
  }
  .row .edit-link{font-size:10px; color:var(--text-dim); text-decoration:underline; margin-top:5px; cursor:pointer; text-align:right;}
  .row .amt-col{width:96px; text-align:right; flex-shrink:0;}
  .row .amt{font-size:15px; font-weight:600;}
  .row .amt.plus{color:var(--income);}
  .row .amt.minus{color:var(--text);}
  .row .bal{font-size:10px; color:var(--text-dim); margin-top:2px;}
  .row.future .memo, .row.future .amt{opacity:.65;}

  .empty{text-align:center; padding:40px 10px; color:var(--text-dim); font-size:13px;}
  .backup-banner{
    background:rgba(193,82,74,.13); border:1px solid rgba(193,82,74,.4); border-radius:10px;
    padding:12px 14px; margin-bottom:14px; font-size:12.5px; line-height:1.6; color:var(--text);
  }
  .backup-banner b{color:var(--danger);}
  .backup-banner button{
    margin-top:8px; background:var(--danger); color:#fff; border:none; padding:8px 12px;
    border-radius:8px; font-family:inherit; font-size:12.5px; cursor:pointer;
  }

  /* upcoming tab */
  .due-group{margin-bottom:16px;}
  .due-group .due-date{
    font-size:13px; font-weight:700; color:var(--gold); margin-bottom:6px;
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .due-group .due-date .total{font-size:13px; color:var(--text);}
  .due-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 10px; background:var(--surface2); border-radius:8px; margin-bottom:6px;
    border-left:3px solid var(--card);
  }
  .due-item .name{font-size:13px;}
  .due-item .memo{font-size:11px; color:var(--text-dim); margin-left:6px;}
  .due-item .amt{font-size:14px; font-weight:600;}

  /* cards settings */
  .card-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px; border-radius:10px; margin-bottom:8px; background:var(--surface2);
    border-left:4px solid var(--card);
  }
  .card-item .name{font-weight:700; font-size:14px;}
  .card-item .rule{font-size:11px; color:var(--text-dim); margin-top:3px;}
  .swatch{width:12px; height:12px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle;}

  label.field{display:block; margin-bottom:12px;}
  label.field .flabel{font-size:12px; color:var(--text-dim); margin-bottom:5px; display:block;}
  input[type=text], input[type=number], input[type=date], input[type=password], textarea{
    width:100%; padding:10px 11px; background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-family:inherit; font-size:16px;
  }
  textarea{resize:vertical; line-height:1.5;}
  input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  input[type=number]{
    -moz-appearance:textfield;
    appearance:textfield;
  }
  .seg{display:flex; gap:6px;}
  .seg button{
    flex:1; padding:9px 4px; background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:8px; font-family:inherit; font-size:13px; cursor:pointer;
  }
  .seg button.sel{background:var(--gold); color:#1b1508; border-color:var(--gold); font-weight:700;}
  .colorset{display:flex; gap:8px; flex-wrap:wrap;}
  .colorset .dot{
    width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;
  }
  .colorset .dot.sel{border-color:var(--text);}

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(6,8,12,.6); z-index:50;
    align-items:flex-end; justify-content:center;
  }
  .modal-overlay.active{display:flex;}
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:16px 16px 0 0;
    width:100%; max-width:640px; padding:20px 18px 24px; max-height:88vh; overflow-y:auto;
  }
  @media (min-width:660px){
    .modal-overlay{align-items:center;}
    .modal{border-radius:16px;}
  }
  .modal h3{margin:0 0 16px; font-size:16px;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-actions .btn-secondary{flex:1;}
  .modal-actions .btn-primary{flex:2;}

  .fab-add{
    display:block; width:100%; margin-bottom:16px;
  }
  ::selection{background:var(--gold); color:#1b1508;}
</style>
</head>
<body>

<div id="app">

  <header class="app-header">
    <div>
      <h1 class="serif">おこづかい帳</h1>
      <div class="sub">CASH &amp; CARD LEDGER</div>
    </div>
    <div class="balance-box">
      <div class="label" id="balanceLabel">現在の残高</div>
      <div class="amount mono" id="currentBalance">¥0</div>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="record" class="active">記録</button>
    <button data-tab="upcoming">引落予定</button>
    <button data-tab="fixed">固定費</button>
    <button data-tab="search">検索</button>
    <button data-tab="settings">カード設定</button>
  </nav>

  <!-- 記録タブ -->
  <section class="panel active" id="panel-record">
    <button class="btn-primary fab-add" id="openAddModal">＋ 記録を追加する</button>

    <div class="card-surface">
      <div class="month-nav">
        <button id="prevMonth">‹</button>
        <div class="month-label mono" id="monthLabel">2026年7月</div>
        <button id="nextMonth">›</button>
      </div>
      <div class="ledger" id="ledgerList"></div>
    </div>
  </section>

  <!-- 予定タブ -->
  <section class="panel" id="panel-upcoming">
    <div class="card-surface">
      <div style="font-size:13px; color:var(--text-dim); margin-bottom:14px;">
        カード利用分が実際に口座から引き落とされる日ごとにまとめています。
      </div>
      <div id="upcomingList"></div>
    </div>
  </section>

  <!-- 固定費タブ -->
  <section class="panel" id="panel-fixed">
    <div class="card-surface">
      <div style="font-size:13px; color:var(--text-dim); margin-bottom:14px;">
        家賃やサブスクなど、毎月同じ日に発生する費用を登録すると、記録に自動で反映されます。
      </div>
      <div id="fixedList"></div>
      <button class="btn-primary" id="openAddFixedModal" style="margin-top:10px;">＋ 固定費を追加する</button>
    </div>
  </section>

  <!-- 検索タブ -->
  <section class="panel" id="panel-search">
    <div class="card-surface">
      <div style="font-size:13px; color:var(--text-dim); margin-bottom:10px;">カテゴリを選んで、月ごとの合計と内訳を確認できます。</div>
      <div class="chip-picker" id="searchCategoryChips"></div>
    </div>
    <div class="card-surface">
      <div class="month-nav">
        <button id="searchPrevMonth">‹</button>
        <div class="month-label mono" id="searchMonthLabel">2026年7月</div>
        <button id="searchNextMonth">›</button>
      </div>
      <div style="text-align:center; margin:6px 0 14px;">
        <div class="label" style="font-size:11px; color:var(--text-dim);" id="searchTotalLabel">カテゴリを選んでください</div>
        <div class="amount mono" style="font-size:26px; color:var(--gold);" id="searchTotal">¥0</div>
      </div>
      <div class="ledger" id="searchResultList"></div>
    </div>
  </section>

  <!-- 設定タブ -->
  <section class="panel" id="panel-settings">
    <div class="card-surface">
      <div style="font-weight:700; font-size:14px; margin-bottom:10px;">カテゴリ</div>
      <div id="categoryList" style="margin-bottom:10px;"></div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="newCategoryInput" placeholder="新しいカテゴリ名" style="flex:1;">
        <button class="btn-secondary" id="addCategoryBtn">追加</button>
      </div>
    </div>

    <div class="card-surface">
      <label class="field">
        <span class="flabel">開始残高（今の手元・口座残高の基準値）</span>
        <input type="number" id="startingBalanceInput" placeholder="0">
      </label>
      <button class="btn-secondary" id="saveStartingBalance">開始残高を保存</button>
    </div>

    <div class="card-surface">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div style="font-weight:700; font-size:14px;">登録したカード</div>
      </div>
      <div id="cardList"></div>
      <button class="btn-primary" id="openAddCardModal" style="margin-top:10px;">＋ カードを追加する</button>
    </div>
  </section>

</div>

<!-- 追加モーダル -->
<div class="modal-overlay" id="txModalOverlay">
  <div class="modal">
    <h3 id="txModalTitle">記録を追加</h3>

    <label class="field">
      <span class="flabel">種別</span>
      <div class="seg" id="txTypeSeg">
        <button data-type="cash" class="sel">現金の支出</button>
        <button data-type="income">収入</button>
        <button data-type="card">カード利用</button>
      </div>
    </label>

    <label class="field">
      <span class="flabel" id="txDateLabel">日付</span>
      <input type="date" id="txDate">
    </label>

    <label class="field" id="txCardField" style="display:none;">
      <span class="flabel">利用したカード</span>
      <div class="seg" id="txCardSeg"></div>
    </label>

    <label class="field">
      <span class="flabel">金額（円）</span>
      <input type="number" id="txAmount" placeholder="0">
    </label>

    <label class="field">
      <span class="flabel">カテゴリ（任意）</span>
      <div class="chip-picker" id="txCategoryChips"></div>
    </label>

    <label class="field">
      <span class="flabel">メモ</span>
      <input type="text" id="txMemo" placeholder="例：スーパーで食材">
    </label>

    <label class="field">
      <span class="flabel">内訳（任意・一覧では「内訳」タップで開閉表示されます）</span>
      <textarea id="txDetail" rows="3" placeholder="例）野菜 300円&#10;お肉 800円&#10;調味料 200円"></textarea>
    </label>

    <div class="modal-actions">
      <button class="btn-secondary" id="txCancel">キャンセル</button>
      <button class="btn-primary" id="txSave">保存する</button>
    </div>
    <div style="margin-top:12px; text-align:center;">
      <button class="btn-text" id="txDuplicate" style="display:none;">同じ内容でもう1件追加する</button>
    </div>
    <div style="margin-top:8px; text-align:center;">
      <button class="btn-danger-text" id="txDelete" style="display:none;">この記録を削除する</button>
    </div>
  </div>
</div>

<!-- カード追加/編集モーダル -->
<div class="modal-overlay" id="cardModalOverlay">
  <div class="modal">
    <h3 id="cardModalTitle">カードを追加</h3>

    <label class="field">
      <span class="flabel">カード名</span>
      <input type="text" id="cardName" placeholder="例：楽天カード">
    </label>

    <label class="field">
      <span class="flabel">色</span>
      <div class="colorset" id="cardColorSet"></div>
    </label>

    <label class="field">
      <span class="flabel">締め日（1〜31、月末なら31）</span>
      <input type="number" id="cardClosing" min="1" max="31" placeholder="15">
    </label>

    <label class="field">
      <span class="flabel">支払月</span>
      <div class="seg" id="cardOffsetSeg">
        <button data-offset="1" class="sel">翌月払い</button>
        <button data-offset="2">翌々月払い</button>
      </div>
    </label>

    <label class="field">
      <span class="flabel">支払日（引き落とし日／1〜31、月末なら31）</span>
      <input type="number" id="cardPayDay" min="1" max="31" placeholder="10">
    </label>

    <div class="modal-actions">
      <button class="btn-secondary" id="cardCancel">キャンセル</button>
      <button class="btn-primary" id="cardSave">保存する</button>
    </div>
    <div style="margin-top:12px; text-align:center;">
      <button class="btn-danger-text" id="cardDelete" style="display:none;">このカードを削除する</button>
    </div>
  </div>
</div>

<!-- 固定費 追加/編集モーダル -->
<div class="modal-overlay" id="fixedModalOverlay">
  <div class="modal">
    <h3 id="fixedModalTitle">固定費を追加</h3>

    <label class="field">
      <span class="flabel">名称</span>
      <input type="text" id="fixedMemo" placeholder="例：家賃、Netflix">
    </label>

    <label class="field">
      <span class="flabel">種別</span>
      <div class="seg" id="fixedTypeSeg">
        <button data-type="cash" class="sel">現金の支出</button>
        <button data-type="card">カード利用</button>
      </div>
    </label>

    <label class="field" id="fixedCardField" style="display:none;">
      <span class="flabel">利用するカード</span>
      <div class="seg" id="fixedCardSeg"></div>
    </label>

    <label class="field">
      <span class="flabel">金額（円）</span>
      <input type="number" id="fixedAmount" placeholder="0">
    </label>

    <label class="field">
      <span class="flabel">カテゴリ（任意）</span>
      <div class="chip-picker" id="fixedCategoryChips"></div>
    </label>

    <label class="field">
      <span class="flabel">毎月何日に発生しますか（1〜31、月末なら31）</span>
      <input type="number" id="fixedDay" min="1" max="31" placeholder="27">
    </label>

    <label class="field">
      <span class="flabel">内訳（任意）</span>
      <textarea id="fixedDetail" rows="2" placeholder="任意のメモ"></textarea>
    </label>

    <div class="modal-actions">
      <button class="btn-secondary" id="fixedCancel">キャンセル</button>
      <button class="btn-primary" id="fixedSave">保存する</button>
    </div>
    <div style="margin-top:12px; text-align:center;">
      <button class="btn-danger-text" id="fixedDelete" style="display:none;">この固定費を削除する</button>
    </div>
  </div>
</div>

<!-- 確認モーダル（削除確認など） -->
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal" style="max-width:360px;">
    <h3 id="confirmMessage">本当によろしいですか？</h3>
    <div class="modal-actions">
      <button class="btn-secondary" id="confirmNo">キャンセル</button>
      <button class="btn-primary" id="confirmYes" style="background:linear-gradient(180deg,#dd8f8f,var(--danger)); box-shadow:0 2px 0 #7a2f2a;">削除する</button>
    </div>
  </div>
</div>

<div id="toast" style="display:none; position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--danger); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; z-index:100; box-shadow:0 4px 14px rgba(0,0,0,.4);"></div>

    appId: "1:271784206777:web:0987d7bd29092cda19d668",
    measurementId: "G-HGPL106BQ6"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
</script>

<script>
(function(){
  const COLORS = ['#7B93C9','#C98A4B','#5FBE95','#C1524A','#C9A24B','#8E7BC9','#4BA9C9'];

  const DEFAULT_CATEGORIES = ['食費','日用品','交通費','娯楽','医療','通信費','住居','水道光熱費','衣服','教育','その他'];

  let meta = {startingBalance:0};
  let cards = [];
  let transactions = [];
  let fixedCosts = [];
  let categories = [];
  let viewDate = new Date(); // 記録タブで表示中の月
  let searchViewDate = new Date(); // 検索タブで表示中の月
  let searchSelectedCategory = null;
  let editingTxId = null;
  let expandedIds = new Set();
  let editingCardId = null;
  let editingFixedId = null;
  let txType = 'cash';
  let txSelectedCardId = null;
  let txSelectedCategory = '';
  let cardOffsetSel = 1;
  let cardColorSel = COLORS[0];
  let fixedType = 'cash';
  let fixedSelectedCardId = null;
  let fixedSelectedCategory = '';

  const $ = (sel)=>document.querySelector(sel);
  const $$ = (sel)=>document.querySelectorAll(sel);

  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function yen(n){ return (n<0?'-':'') + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP'); }
  function fmtDate(d){ return `${d.getMonth()+1}/${d.getDate()}`; }
  function wdShort(d){ return ['日','月','火','水','木','金','土'][d.getDay()]; }
  function ymKey(d){ return d.getFullYear()+'-'+d.getMonth(); }
  function isoDate(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function clampDay(y,m,day){ return Math.min(day, daysInMonth(y,m)); }

  function computeWithdrawalDate(purchaseDate, card){
    const y = purchaseDate.getFullYear(), m = purchaseDate.getMonth(), d = purchaseDate.getDate();
    const closing = clampDay(y,m, card.closingDay);
    let cy=y, cm=m;
    if(d > closing){ cm+=1; if(cm>11){cm=0; cy+=1;} }
    let wy=cy, wm=cm + (card.paymentOffset||1);
    while(wm>11){ wm-=12; wy+=1; }
    const wd = clampDay(wy, wm, card.paymentDay);
    return new Date(wy, wm, wd);
  }

  function getCard(id){
    return cards.find(c=>c.id===id) || null;
  }

  function addMonths(y,m,delta){
    const total = y*12+m+delta;
    const ny = Math.floor(total/12);
    const nm = ((total%12)+12)%12;
    return [ny, nm];
  }

  // fc.amountHistory（あれば）から、指定した年月キー（year*12+month）時点の金額を求める。
  // 未編集（historyなし）の場合は今まで通り fc.amount をそのまま使う。
  function getFixedAmountAt(fc, key){
    if(!fc.amountHistory || fc.amountHistory.length===0) return fc.amount;
    let applicable = fc.amountHistory[0].amount;
    for(const h of fc.amountHistory){
      if(h.fromKey <= key) applicable = h.amount; else break;
    }
    return applicable;
  }

  function buildEvents(){
    // returns array {id, txId, date(Date), amount(signed), kind, affectsBalance, memo, category, cardName, cardColor, purchaseDate/withdrawalDate}
    const events = [];
    for(const tx of transactions){
      if(tx.kind==='cash'){
        events.push({id:tx.id+'-e', txId:tx.id, date:new Date(tx.date+'T00:00:00'), amount:-tx.amount, kind:'cash', affectsBalance:true, memo:tx.memo, detail:tx.detail||'', category:tx.category||''});
      } else if(tx.kind==='income'){
        events.push({id:tx.id+'-e', txId:tx.id, date:new Date(tx.date+'T00:00:00'), amount:tx.amount, kind:'income', affectsBalance:true, memo:tx.memo, detail:tx.detail||'', category:tx.category||''});
      } else if(tx.kind==='card'){
        const card = getCard(tx.cardId);
        const useCard = card || {name:(tx.cardNameSnapshot||'削除済みカード'), color:'#666', closingDay:15, paymentOffset:1, paymentDay:10};
        const purchaseDate = new Date(tx.date+'T00:00:00');
        const wDate = computeWithdrawalDate(purchaseDate, useCard);
        // 利用日の記録（カード名表示・残高にはまだ影響しない）
        events.push({id:tx.id+'-use', txId:tx.id, date:purchaseDate, withdrawalDate:wDate, amount:-tx.amount, kind:'card_use', affectsBalance:false, memo:tx.memo, detail:tx.detail||'', category:tx.category||'', cardName:useCard.name, cardColor:useCard.color, cardMissing: !card});
        // 引き落とし日の記録（実際に残高が減る）
        events.push({id:tx.id+'-withdraw', txId:tx.id, date:wDate, purchaseDate, amount:-tx.amount, kind:'card', affectsBalance:true, memo:tx.memo, detail:tx.detail||'', category:tx.category||'', cardName:useCard.name, cardColor:useCard.color, cardMissing: !card});
      }
    }

    // 固定費：毎月指定日に自動で発生させる（過去36ヶ月分。実際にその日が来るまでは記録に出さない）
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    for(const fc of fixedCosts){
      for(let delta=-36; delta<=0; delta++){
        const [fy, fm] = addMonths(now.getFullYear(), now.getMonth(), delta);
        const day = clampDay(fy, fm, fc.day);
        const occDate = new Date(fy, fm, day);
        const ym = `${fy}-${fm}`;
        const occKey = fy*12+fm;
        const occAmount = getFixedAmountAt(fc, occKey);
        if(fc.kind==='cash'){
          if(occDate > today) continue;
          events.push({id:'fixed-'+fc.id+'-'+ym, txId:'fixed:'+fc.id+':'+ym, date:occDate, amount:-occAmount, kind:'cash', affectsBalance:true, memo:fc.memo, detail:fc.detail||'', category:fc.category||'', isFixed:true, fixedId:fc.id});
        } else if(fc.kind==='card'){
          const card = getCard(fc.cardId);
          const useCard = card || {name:(fc.cardNameSnapshot||'削除済みカード'), color:'#666', closingDay:15, paymentOffset:1, paymentDay:10};
          const wDate = computeWithdrawalDate(occDate, useCard);
          if(occDate <= today){
            events.push({id:'fixed-use-'+fc.id+'-'+ym, txId:'fixed:'+fc.id+':'+ym+':use', date:occDate, withdrawalDate:wDate, amount:-occAmount, kind:'card_use', affectsBalance:false, memo:fc.memo, detail:fc.detail||'', category:fc.category||'', cardName:useCard.name, cardColor:useCard.color, isFixed:true, fixedId:fc.id, cardMissing:!card});
          }
          if(wDate <= today){
            events.push({id:'fixed-withdraw-'+fc.id+'-'+ym, txId:'fixed:'+fc.id+':'+ym+':withdraw', date:wDate, purchaseDate:occDate, amount:-occAmount, kind:'card', affectsBalance:true, memo:fc.memo, detail:fc.detail||'', category:fc.category||'', cardName:useCard.name, cardColor:useCard.color, isFixed:true, fixedId:fc.id, cardMissing:!card});
          }
        }
      }
    }

    events.sort((a,b)=> a.date-b.date || kindOrder(a)-kindOrder(b) || a.txId.localeCompare(b.txId));
    return events;
  }
  function kindOrder(e){ return e.kind==='card_use' ? 0 : e.kind==='card' ? 2 : 1; }

  async function storageGet(key){
    const uid = auth.currentUser && auth.currentUser.uid;
    if(!uid) return null;
    try{
      const doc = await db.collection('users').doc(uid).collection('data').doc(key).get();
      if(!doc.exists) return null;
      return {key, value: doc.data().value};
    }catch(e){ console.error(e); return null; }
  }
  async function storageSet(key, value){
    const uid = auth.currentUser && auth.currentUser.uid;
    if(!uid) return null;
    try{
      await db.collection('users').doc(uid).collection('data').doc(key).set({value});
      return {key, value};
    }catch(e){ console.error(e); showToast('保存に失敗しました（通信をご確認ください）'); return null; }
  }

  async function loadAll(){
    try{ const r = await storageGet('meta'); meta = r?JSON.parse(r.value):{startingBalance:0}; }catch(e){ meta={startingBalance:0}; }
    try{ const r = await storageGet('cards'); cards = r?JSON.parse(r.value):[]; }catch(e){ cards=[]; }
    try{ const r = await storageGet('transactions'); transactions = r?JSON.parse(r.value):[]; }catch(e){ transactions=[]; }
    try{ const r = await storageGet('fixedCosts'); fixedCosts = r?JSON.parse(r.value):[]; }catch(e){ fixedCosts=[]; }
    try{
      const r = await storageGet('categories');
      if(r){ categories = JSON.parse(r.value); }
      else { categories = [...DEFAULT_CATEGORIES]; await saveCategories(); }
    }catch(e){ categories = [...DEFAULT_CATEGORIES]; }
    render();
  }
  async function saveMeta(){ await storageSet('meta', JSON.stringify(meta)); }
  async function saveCards(){ await storageSet('cards', JSON.stringify(cards)); }
  async function saveTransactions(){ await storageSet('transactions', JSON.stringify(transactions)); }
  async function saveFixedCosts(){ await storageSet('fixedCosts', JSON.stringify(fixedCosts)); }
  async function saveCategories(){ await storageSet('categories', JSON.stringify(categories)); }

  // ---------- rendering ----------
  function render(){
    renderBalance();
    renderLedger();
    renderUpcoming();
    renderCardSettings();
    renderFixedList();
    renderCategoryList();
    renderSearchCategoryChips();
    renderSearch();
    $('#startingBalanceInput').value = meta.startingBalance || 0;
  }

  function renderBalance(){
    const now = new Date();
    const isCurrentMonth = viewDate.getFullYear()===now.getFullYear() && viewDate.getMonth()===now.getMonth();
    const y = viewDate.getFullYear(), m = viewDate.getMonth();
    const events = buildEvents();
    let monthTotal = 0;
    for(const e of events){
      if(e.affectsBalance!==false && e.date.getFullYear()===y && e.date.getMonth()===m) monthTotal += e.amount;
    }
    $('#currentBalance').textContent = yen(monthTotal);
    $('#balanceLabel').textContent = isCurrentMonth ? '今月の合計' : `${y}年${m+1}月の合計`;
  }

  function renderLedger(){
    $('#monthLabel').textContent = `${viewDate.getFullYear()}年${viewDate.getMonth()+1}月`;
    const y = viewDate.getFullYear(), m = viewDate.getMonth();
    const monthStart = new Date(y,m,1);
    const events = buildEvents();
    let running = meta.startingBalance||0;
    for(const e of events){ if(e.date < monthStart && e.affectsBalance!==false) running += e.amount; }

    const monthEvents = events.filter(e=> e.date.getFullYear()===y && e.date.getMonth()===m);
    const today = new Date(); today.setHours(0,0,0,0);
    const list = $('#ledgerList');
    list.innerHTML = '';
    if(monthEvents.length===0){
      list.innerHTML = '<div class="empty">この月の記録はまだありません</div>';
      return;
    }
    for(const e of monthEvents){
      if(e.affectsBalance !== false){ running += e.amount; }
      const row = document.createElement('div');
      row.className = 'row' + (e.date>today ? ' future' : '');
      const tagClass = e.kind==='card_use' ? 'card' : e.kind;
      const tagLabel = e.kind==='cash' ? '現金' : e.kind==='income' ? '収入' : (e.cardName||'カード');
      let subLine = '';
      if(e.kind==='card'){
        subLine = `購入 ${fmtDate(e.purchaseDate)} → 引落 ${fmtDate(e.date)}` + (e.date>today ? '（予定）':'');
      } else if(e.kind==='card_use'){
        subLine = `引き落とし予定 ${fmtDate(e.withdrawalDate)}`;
      }
      const hasDetail = !!(e.detail && e.detail.trim());
      const isOpen = expandedIds.has(e.txId);
      const balCol = e.affectsBalance===false ? '引落待ち' : `残高 ${yen(running)}`;
      row.innerHTML = `
        <div class="date-col mono">${fmtDate(e.date)}<div class="wd">${wdShort(e.date)}</div></div>
        <div class="mid">
          <span class="tag ${tagClass}" style="${(e.kind==='card'||e.kind==='card_use') && e.cardColor ? `background:${e.cardColor}2e; color:${e.cardColor};`:''}">${tagLabel}</span>
          ${e.isFixed ? `<span class="tag fixed">固定</span>` : ''}
          <span class="memo">${escapeHtml(e.memo||'（メモなし）')}</span>
          ${subLine ? `<div class="sub">${subLine}</div>` : ''}
          ${hasDetail ? `<div class="detail-toggle">内訳 ${isOpen?'▴':'▾'}</div>` : ''}
          ${(hasDetail && isOpen) ? `<div class="detail-box">${escapeHtml(e.detail)}</div>` : ''}
        </div>
        <div class="amt-col">
          <div class="amt mono ${e.amount>0?'plus':'minus'}">${e.amount>0?'+':''}${yen(e.amount)}</div>
          <div class="bal mono">${balCol}</div>
          <div class="edit-link">編集</div>
        </div>
      `;
      const goEdit = ()=>{ if(e.isFixed){ openEditFixed(e.fixedId); } else { openEditTx(e.txId); } };
      row.querySelector('.edit-link').addEventListener('click', (ev)=>{
        ev.stopPropagation();
        goEdit();
      });
      if(hasDetail){
        row.style.cursor='pointer';
        row.addEventListener('click', ()=>{
          if(expandedIds.has(e.txId)) expandedIds.delete(e.txId); else expandedIds.add(e.txId);
          renderLedger();
        });
      } else {
        row.style.cursor='pointer';
        row.addEventListener('click', goEdit);
      }
      list.appendChild(row);
    }
  }

  function renderUpcoming(){
    const events = buildEvents().filter(e=>e.kind==='card');
    const today = new Date(); today.setHours(0,0,0,0);
    const future = events.filter(e=>e.date>=today).sort((a,b)=>a.date-b.date);
    const wrap = $('#upcomingList');
    wrap.innerHTML='';
    if(future.length===0){
      wrap.innerHTML = '<div class="empty">今後予定されているカード引き落としはありません</div>';
      return;
    }
    const groups = {};
    for(const e of future){
      const key = isoDate(e.date);
      if(!groups[key]) groups[key]=[];
      groups[key].push(e);
    }
    for(const key of Object.keys(groups).sort()){
      const items = groups[key];
      const d = new Date(key+'T00:00:00');
      const total = items.reduce((s,e)=>s+(-e.amount),0);
      const g = document.createElement('div');
      g.className='due-group';
      g.innerHTML = `<div class="due-date"><span>${d.getFullYear()}年${fmtDate(d)}（${wdShort(d)}）</span><span class="total mono">${yen(-total)}</span></div>`;
      for(const e of items){
        const item = document.createElement('div');
        item.className='due-item';
        item.style.borderLeftColor = e.cardColor||'#7B93C9';
        item.innerHTML = `<span class="name">${escapeHtml(e.cardName)}<span class="memo">${escapeHtml(e.memo||'')}</span></span><span class="amt mono">${yen(e.amount)}</span>`;
        g.appendChild(item);
      }
      wrap.appendChild(g);
    }
  }

  function renderSearchCategoryChips(){
    const wrap = $('#searchCategoryChips');
    wrap.innerHTML='';
    if(categories.length===0){
      wrap.innerHTML = '<div class="empty">設定タブからカテゴリを追加してください</div>';
      return;
    }
    for(const c of categories){
      const b = document.createElement('button');
      b.type='button';
      b.textContent = c;
      if(c===searchSelectedCategory) b.classList.add('sel');
      b.addEventListener('click', ()=>{ searchSelectedCategory = (searchSelectedCategory===c) ? null : c; renderSearchCategoryChips(); renderSearch(); });
      wrap.appendChild(b);
    }
  }

  function renderSearch(){
    $('#searchMonthLabel').textContent = `${searchViewDate.getFullYear()}年${searchViewDate.getMonth()+1}月`;
    const list = $('#searchResultList');
    if(!searchSelectedCategory){
      $('#searchTotalLabel').textContent = 'カテゴリを選んでください';
      $('#searchTotal').textContent = '¥0';
      list.innerHTML = '';
      return;
    }
    const y = searchViewDate.getFullYear(), m = searchViewDate.getMonth();
    // card_use（購入日ベース）を使い、引落日側の重複(kind:'card')は集計から除外する
    const events = buildEvents().filter(e=>
      e.category===searchSelectedCategory && e.kind!=='card' &&
      e.date.getFullYear()===y && e.date.getMonth()===m
    ).sort((a,b)=>a.date-b.date);

    const total = events.reduce((s,e)=>s+e.amount,0);
    $('#searchTotalLabel').textContent = `「${searchSelectedCategory}」の${m+1}月合計`;
    $('#searchTotal').textContent = yen(total);

    list.innerHTML = '';
    if(events.length===0){
      list.innerHTML = '<div class="empty">該当する記録はありません</div>';
      return;
    }
    for(const e of events){
      const row = document.createElement('div');
      row.className = 'row';
      const tagLabel = e.kind==='cash' ? '現金' : e.kind==='income' ? '収入' : (e.cardName||'カード');
      row.innerHTML = `
        <div class="date-col mono">${fmtDate(e.date)}<div class="wd">${wdShort(e.date)}</div></div>
        <div class="mid">
          <span class="tag ${e.kind==='card_use'?'card':e.kind}">${tagLabel}</span>
          <span class="memo">${escapeHtml(e.memo||'（メモなし）')}</span>
        </div>
        <div class="amt-col">
          <div class="amt mono ${e.amount>0?'plus':'minus'}">${e.amount>0?'+':''}${yen(e.amount)}</div>
          <div class="edit-link">編集</div>
        </div>
      `;
      const goEdit = ()=>{ if(e.isFixed){ openEditFixed(e.fixedId); } else { openEditTx(e.txId); } };
      row.querySelector('.edit-link').addEventListener('click', (ev)=>{ ev.stopPropagation(); goEdit(); });
      row.style.cursor='pointer';
      row.addEventListener('click', goEdit);
      list.appendChild(row);
    }
  }

  function renderCardSettings(){
    const wrap = $('#cardList');
    wrap.innerHTML='';
    if(cards.length===0){
      wrap.innerHTML = '<div class="empty">まだカードが登録されていません</div>';
      return;
    }
    for(const c of cards){
      const el = document.createElement('div');
      el.className='card-item';
      el.style.borderLeftColor = c.color;
      const offsetLabel = c.paymentOffset===2 ? '翌々月' : '翌月';
      el.innerHTML = `
        <div>
          <div class="name"><span class="swatch" style="background:${c.color}"></span>${escapeHtml(c.name)}</div>
          <div class="rule">毎月${c.closingDay}日締め → ${offsetLabel}${c.paymentDay}日引き落とし</div>
        </div>
        <button class="btn-text">編集</button>
      `;
      el.querySelector('button').addEventListener('click', ()=>openEditCard(c.id));
      wrap.appendChild(el);
    }
  }

  function renderFixedList(){
    const wrap = $('#fixedList');
    wrap.innerHTML='';
    if(fixedCosts.length===0){
      wrap.innerHTML = '<div class="empty">まだ固定費が登録されていません</div>';
      return;
    }
    const sorted = [...fixedCosts].sort((a,b)=>a.day-b.day);
    for(const fc of sorted){
      const el = document.createElement('div');
      el.className='card-item';
      let ruleText;
      if(fc.kind==='card'){
        const card = getCard(fc.cardId);
        const cardName = card ? card.name : (fc.cardNameSnapshot||'削除済みカード');
        el.style.borderLeftColor = card ? card.color : '#666';
        ruleText = `毎月${fc.day}日利用 → ${escapeHtml(cardName)}`;
      } else {
        el.style.borderLeftColor = 'var(--cash)';
        ruleText = `毎月${fc.day}日に現金支出`;
      }
      el.innerHTML = `
        <div>
          <div class="name">${escapeHtml(fc.memo)}</div>
          <div class="rule">${ruleText}　${yen(fc.amount)}</div>
        </div>
        <button class="btn-text">編集</button>
      `;
      el.querySelector('button').addEventListener('click', ()=>openEditFixed(fc.id));
      wrap.appendChild(el);
    }
  }

  function renderCategoryList(){
    const wrap = $('#categoryList');
    if(categories.length===0){
      wrap.innerHTML = '<div class="empty" style="padding:10px;">カテゴリがありません</div>';
      return;
    }
    wrap.innerHTML = categories.map(c=>`<span class="cat-chip">${escapeHtml(c)}<button data-cat="${escapeHtml(c)}">×</button></span>`).join('');
    wrap.querySelectorAll('button[data-cat]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const cat = btn.dataset.cat;
        const ok = await showConfirm(`「${cat}」を削除しますか？（過去の記録には残ります）`);
        if(!ok) return;
        categories = categories.filter(c=>c!==cat);
        await saveCategories();
        render();
      });
    });
  }

  let toastTimer = null;
  function showToast(msg){
    const t = $('#toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ t.style.display='none'; }, 2600);
  }

  function showConfirm(message){
    return new Promise(resolve=>{
      $('#confirmMessage').textContent = message;
      $('#confirmOverlay').classList.add('active');
      const yes = $('#confirmYes'), no = $('#confirmNo');
      function cleanup(result){
        $('#confirmOverlay').classList.remove('active');
        yes.removeEventListener('click', onYes);
        no.removeEventListener('click', onNo);
        resolve(result);
      }
      function onYes(){ cleanup(true); }
      function onNo(){ cleanup(false); }
      yes.addEventListener('click', onYes);
      no.addEventListener('click', onNo);
    });
  }

  function closeModalSafely(overlaySelector){
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
    $(overlaySelector).classList.remove('active');
    // absorb the mobile "ghost click" that can otherwise fire on whatever
    // now sits under the tapped point once the list re-renders
    const guard = document.createElement('div');
    guard.style.cssText = 'position:fixed; inset:0; z-index:999; background:transparent;';
    document.body.appendChild(guard);
    setTimeout(()=>{ guard.remove(); }, 400);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ---------- tabs ----------
  $$('nav.tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      $$('nav.tabs button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      $$('.panel').forEach(p=>p.classList.remove('active'));
      $('#panel-'+tab).classList.add('active');
    });
  });

  // ---------- month nav ----------
  $('#prevMonth').addEventListener('click', ()=>{ viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1); renderLedger(); renderBalance(); });
  $('#nextMonth').addEventListener('click', ()=>{ viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1); renderLedger(); renderBalance(); });

  $('#searchPrevMonth').addEventListener('click', ()=>{ searchViewDate = new Date(searchViewDate.getFullYear(), searchViewDate.getMonth()-1, 1); renderSearch(); });
  $('#searchNextMonth').addEventListener('click', ()=>{ searchViewDate = new Date(searchViewDate.getFullYear(), searchViewDate.getMonth()+1, 1); renderSearch(); });

  // ---------- tx modal ----------
  function refreshTxCardSeg(){
    const seg = $('#txCardSeg');
    seg.innerHTML='';
    if(cards.length===0){
      seg.innerHTML = '<div style="font-size:12px; color:var(--text-dim);">先に「カード設定」からカードを登録してください</div>';
      return;
    }
    if(!txSelectedCardId) txSelectedCardId = cards[0].id;
    for(const c of cards){
      const b = document.createElement('button');
      b.textContent = c.name;
      b.type='button';
      if(c.id===txSelectedCardId) b.classList.add('sel');
      b.addEventListener('click', ()=>{ txSelectedCardId=c.id; refreshTxCardSeg(); });
      seg.appendChild(b);
    }
  }

  function refreshTxCategoryChips(){
    const wrap = $('#txCategoryChips');
    wrap.innerHTML='';
    if(categories.length===0){
      wrap.innerHTML = '<div style="font-size:12px; color:var(--text-dim);">設定タブからカテゴリを追加できます</div>';
      return;
    }
    for(const c of categories){
      const b = document.createElement('button');
      b.type='button';
      b.textContent = c;
      if(c===txSelectedCategory) b.classList.add('sel');
      b.addEventListener('click', ()=>{ txSelectedCategory = (txSelectedCategory===c) ? '' : c; refreshTxCategoryChips(); });
      wrap.appendChild(b);
    }
  }

  function setTxType(type){
    txType = type;
    $$('#txTypeSeg button').forEach(b=>b.classList.toggle('sel', b.dataset.type===type));
    $('#txCardField').style.display = type==='card' ? 'block' : 'none';
    $('#txDateLabel').textContent = type==='card' ? '購入日' : '日付';
    if(type==='card') refreshTxCardSeg();
  }
  $$('#txTypeSeg button').forEach(b=> b.addEventListener('click', ()=> setTxType(b.dataset.type)) );

  function openAddTx(){
    editingTxId = null;
    $('#txModalTitle').textContent = '記録を追加';
    $('#txDelete').style.display='none';
    $('#txDuplicate').style.display='none';
    setTxType('cash');
    $('#txDate').value = isoDate(new Date());
    $('#txAmount').value='';
    txSelectedCategory = '';
    refreshTxCategoryChips();
    $('#txMemo').value='';
    $('#txDetail').value='';
    $('#txModalOverlay').classList.add('active');
  }
  $('#openAddModal').addEventListener('click', openAddTx);

  function openEditTx(txId){
    const tx = transactions.find(t=>t.id===txId);
    if(!tx) return;
    editingTxId = txId;
    $('#txModalTitle').textContent = '記録を編集';
    $('#txDelete').style.display='inline-block';
    $('#txDuplicate').style.display='inline-block';
    setTxType(tx.kind);
    if(tx.kind==='card') { txSelectedCardId = tx.cardId; refreshTxCardSeg(); }
    $('#txDate').value = tx.date;
    $('#txAmount').value = tx.amount;
    txSelectedCategory = tx.category || '';
    refreshTxCategoryChips();
    $('#txMemo').value = tx.memo||'';
    $('#txDetail').value = tx.detail||'';
    $('#txModalOverlay').classList.add('active');
  }

  $('#txCancel').addEventListener('click', ()=> $('#txModalOverlay').classList.remove('active'));

  $('#txDuplicate').addEventListener('click', ()=>{
    const kind = txType;
    const cardId = txSelectedCardId;
    const category = txSelectedCategory;
    const amount = $('#txAmount').value;
    const memo = $('#txMemo').value;
    const detail = $('#txDetail').value;
    openAddTx();
    setTxType(kind);
    if(kind==='card'){ txSelectedCardId = cardId; refreshTxCardSeg(); }
    txSelectedCategory = category;
    refreshTxCategoryChips();
    $('#txAmount').value = amount;
    $('#txMemo').value = memo;
    $('#txDetail').value = detail;
  });

  let txActionInProgress = false;

  $('#txSave').addEventListener('click', async ()=>{
    if(txActionInProgress) return;
    const date = $('#txDate').value;
    const amount = parseFloat($('#txAmount').value);
    const memo = $('#txMemo').value.trim();
    const detail = $('#txDetail').value.trim();
    if(!date || isNaN(amount) || amount<=0){ showToast('日付と金額を正しく入力してください'); return; }
    if(txType==='card' && !txSelectedCardId){ showToast('カードを選択するか、先にカードを登録してください'); return; }

    txActionInProgress = true;
    try{
      if(editingTxId){
        const tx = transactions.find(t=>t.id===editingTxId);
        tx.kind = txType; tx.date=date; tx.amount=amount; tx.memo=memo; tx.detail=detail; tx.category=txSelectedCategory;
        if(txType==='card'){ tx.cardId = txSelectedCardId; tx.cardNameSnapshot = getCard(txSelectedCardId)?.name; } else { delete tx.cardId; }
      } else {
        const tx = {id:uid(), kind:txType, date, amount, memo, detail, category:txSelectedCategory};
        if(txType==='card'){ tx.cardId = txSelectedCardId; tx.cardNameSnapshot = getCard(txSelectedCardId)?.name; }
        transactions.push(tx);
      }
      await saveTransactions();
      closeModalSafely('#txModalOverlay');
      render();
    } finally {
      txActionInProgress = false;
    }
  });

  $('#txDelete').addEventListener('click', async ()=>{
    if(txActionInProgress) return;
    if(!editingTxId) return;
    txActionInProgress = true;
    try{
      const ok = await showConfirm('この記録を削除しますか？');
      if(!ok) return;
      transactions = transactions.filter(t=>t.id!==editingTxId);
      await saveTransactions();
      closeModalSafely('#txModalOverlay');
      render();
    } finally {
      txActionInProgress = false;
    }
  });

  // ---------- カテゴリ ----------
  $('#addCategoryBtn').addEventListener('click', async ()=>{
    const name = $('#newCategoryInput').value.trim();
    if(!name){ showToast('カテゴリ名を入力してください'); return; }
    if(categories.includes(name)){ showToast('そのカテゴリは既にあります'); return; }
    categories.push(name);
    await saveCategories();
    $('#newCategoryInput').value = '';
    render();
  });

  // ---------- starting balance ----------
  $('#saveStartingBalance').addEventListener('click', async ()=>{
    const v = parseFloat($('#startingBalanceInput').value);
    meta.startingBalance = isNaN(v)?0:v;
    await saveMeta();
    render();
  });

  // ---------- card modal ----------
  function refreshCardColorSet(){
    const wrap = $('#cardColorSet');
    wrap.innerHTML='';
    for(const col of COLORS){
      const d = document.createElement('div');
      d.className='dot' + (col===cardColorSel?' sel':'');
      d.style.background=col;
      d.addEventListener('click', ()=>{ cardColorSel=col; refreshCardColorSet(); });
      wrap.appendChild(d);
    }
  }
  $$('#cardOffsetSeg button').forEach(b=>{
    b.addEventListener('click', ()=>{
      cardOffsetSel = parseInt(b.dataset.offset,10);
      $$('#cardOffsetSeg button').forEach(x=>x.classList.toggle('sel', x===b));
    });
  });

  function openAddCard(){
    editingCardId = null;
    $('#cardModalTitle').textContent='カードを追加';
    $('#cardDelete').style.display='none';
    $('#cardName').value='';
    $('#cardClosing').value='15';
    $('#cardPayDay').value='10';
    cardOffsetSel = 1;
    $$('#cardOffsetSeg button').forEach(x=>x.classList.toggle('sel', x.dataset.offset==='1'));
    cardColorSel = COLORS[cards.length % COLORS.length];
    refreshCardColorSet();
    $('#cardModalOverlay').classList.add('active');
  }
  $('#openAddCardModal').addEventListener('click', openAddCard);

  function openEditCard(id){
    const c = cards.find(c=>c.id===id);
    if(!c) return;
    editingCardId = id;
    $('#cardModalTitle').textContent='カードを編集';
    $('#cardDelete').style.display='inline-block';
    $('#cardName').value=c.name;
    $('#cardClosing').value=c.closingDay;
    $('#cardPayDay').value=c.paymentDay;
    cardOffsetSel = c.paymentOffset;
    $$('#cardOffsetSeg button').forEach(x=>x.classList.toggle('sel', parseInt(x.dataset.offset,10)===cardOffsetSel));
    cardColorSel = c.color;
    refreshCardColorSet();
    $('#cardModalOverlay').classList.add('active');
  }

  $('#cardCancel').addEventListener('click', ()=> $('#cardModalOverlay').classList.remove('active'));

  let cardActionInProgress = false;

  $('#cardSave').addEventListener('click', async ()=>{
    if(cardActionInProgress) return;
    const name = $('#cardName').value.trim();
    const closingDay = parseInt($('#cardClosing').value,10);
    const paymentDay = parseInt($('#cardPayDay').value,10);
    if(!name || !closingDay || closingDay<1 || closingDay>31 || !paymentDay || paymentDay<1 || paymentDay>31){
      showToast('カード名・締め日・支払日を正しく入力してください'); return;
    }
    cardActionInProgress = true;
    try{
      if(editingCardId){
        const c = cards.find(c=>c.id===editingCardId);
        c.name=name; c.color=cardColorSel; c.closingDay=closingDay; c.paymentOffset=cardOffsetSel; c.paymentDay=paymentDay;
      } else {
        cards.push({id:uid(), name, color:cardColorSel, closingDay, paymentOffset:cardOffsetSel, paymentDay});
      }
      await saveCards();
      closeModalSafely('#cardModalOverlay');
      render();
    } finally {
      cardActionInProgress = false;
    }
  });

  $('#cardDelete').addEventListener('click', async ()=>{
    if(cardActionInProgress) return;
    if(!editingCardId) return;
    cardActionInProgress = true;
    try{
      const used = transactions.some(t=>t.cardId===editingCardId);
      const msg = used ? 'このカードを使った記録が既にあります。カードを削除しても記録は残りますが、今後の設定変更はできなくなります。削除しますか？' : 'このカードを削除しますか？';
      const ok = await showConfirm(msg);
      if(!ok) return;
      cards = cards.filter(c=>c.id!==editingCardId);
      await saveCards();
      closeModalSafely('#cardModalOverlay');
      render();
    } finally {
      cardActionInProgress = false;
    }
  });

  // ---------- 固定費 ----------
  function refreshFixedCardSeg(){
    const seg = $('#fixedCardSeg');
    seg.innerHTML='';
    if(cards.length===0){
      seg.innerHTML = '<div style="font-size:12px; color:var(--text-dim);">先に「カード設定」からカードを登録してください</div>';
      return;
    }
    if(!fixedSelectedCardId) fixedSelectedCardId = cards[0].id;
    for(const c of cards){
      const b = document.createElement('button');
      b.textContent = c.name;
      b.type='button';
      if(c.id===fixedSelectedCardId) b.classList.add('sel');
      b.addEventListener('click', ()=>{ fixedSelectedCardId=c.id; refreshFixedCardSeg(); });
      seg.appendChild(b);
    }
  }

  function refreshFixedCategoryChips(){
    const wrap = $('#fixedCategoryChips');
    wrap.innerHTML='';
    if(categories.length===0){
      wrap.innerHTML = '<div style="font-size:12px; color:var(--text-dim);">設定タブからカテゴリを追加できます</div>';
      return;
    }
    for(const c of categories){
      const b = document.createElement('button');
      b.type='button';
      b.textContent = c;
      if(c===fixedSelectedCategory) b.classList.add('sel');
      b.addEventListener('click', ()=>{ fixedSelectedCategory = (fixedSelectedCategory===c) ? '' : c; refreshFixedCategoryChips(); });
      wrap.appendChild(b);
    }
  }

  function setFixedType(type){
    fixedType = type;
    $$('#fixedTypeSeg button').forEach(b=>b.classList.toggle('sel', b.dataset.type===type));
    $('#fixedCardField').style.display = type==='card' ? 'block' : 'none';
    if(type==='card') refreshFixedCardSeg();
  }
  $$('#fixedTypeSeg button').forEach(b=> b.addEventListener('click', ()=> setFixedType(b.dataset.type)) );

  function openAddFixed(){
    editingFixedId = null;
    $('#fixedModalTitle').textContent = '固定費を追加';
    $('#fixedDelete').style.display='none';
    setFixedType('cash');
    $('#fixedMemo').value='';
    $('#fixedAmount').value='';
    fixedSelectedCategory = '';
    refreshFixedCategoryChips();
    $('#fixedDay').value='';
    $('#fixedDetail').value='';
    $('#fixedModalOverlay').classList.add('active');
  }
  $('#openAddFixedModal').addEventListener('click', openAddFixed);

  function openEditFixed(id){
    const fc = fixedCosts.find(f=>f.id===id);
    if(!fc) return;
    editingFixedId = id;
    $('#fixedModalTitle').textContent = '固定費を編集';
    $('#fixedDelete').style.display='inline-block';
    setFixedType(fc.kind);
    if(fc.kind==='card'){ fixedSelectedCardId = fc.cardId; refreshFixedCardSeg(); }
    $('#fixedMemo').value = fc.memo;
    $('#fixedAmount').value = fc.amount;
    fixedSelectedCategory = fc.category || '';
    refreshFixedCategoryChips();
    $('#fixedDay').value = fc.day;
    $('#fixedDetail').value = fc.detail||'';
    $('#fixedModalOverlay').classList.add('active');
  }

  $('#fixedCancel').addEventListener('click', ()=> $('#fixedModalOverlay').classList.remove('active'));

  let fixedActionInProgress = false;

  $('#fixedSave').addEventListener('click', async ()=>{
    if(fixedActionInProgress) return;
    const memo = $('#fixedMemo').value.trim();
    const amount = parseFloat($('#fixedAmount').value);
    const day = parseInt($('#fixedDay').value, 10);
    const detail = $('#fixedDetail').value.trim();
    if(!memo){ showToast('名称を入力してください'); return; }
    if(isNaN(amount) || amount<=0){ showToast('金額を正しく入力してください'); return; }
    if(!day || day<1 || day>31){ showToast('日付は1〜31で入力してください'); return; }
    if(fixedType==='card' && !fixedSelectedCardId){ showToast('カードを選択するか、先にカードを登録してください'); return; }

    fixedActionInProgress = true;
    try{
      if(editingFixedId){
        const fc = fixedCosts.find(f=>f.id===editingFixedId);
        const now = new Date();
        const nowKey = now.getFullYear()*12+now.getMonth();
        const currentEffective = getFixedAmountAt(fc, nowKey);
        if(amount !== currentEffective){
          if(!fc.amountHistory || fc.amountHistory.length===0){ fc.amountHistory = [{fromKey:-999999, amount:fc.amount}]; }
          fc.amountHistory = fc.amountHistory.filter(h=>h.fromKey < nowKey);
          fc.amountHistory.push({fromKey: nowKey, amount});
          fc.amountHistory.sort((a,b)=>a.fromKey-b.fromKey);
        }
        fc.kind = fixedType; fc.memo=memo; fc.amount=amount; fc.day=day; fc.detail=detail; fc.category=fixedSelectedCategory;
        if(fixedType==='card'){ fc.cardId = fixedSelectedCardId; fc.cardNameSnapshot = getCard(fixedSelectedCardId)?.name; } else { delete fc.cardId; }
      } else {
        const fc = {id:uid(), kind:fixedType, memo, amount, day, detail, category:fixedSelectedCategory};
        if(fixedType==='card'){ fc.cardId = fixedSelectedCardId; fc.cardNameSnapshot = getCard(fixedSelectedCardId)?.name; }
        fixedCosts.push(fc);
      }
      await saveFixedCosts();
      closeModalSafely('#fixedModalOverlay');
      render();
    } finally {
      fixedActionInProgress = false;
    }
  });

  $('#fixedDelete').addEventListener('click', async ()=>{
    if(fixedActionInProgress) return;
    if(!editingFixedId) return;
    fixedActionInProgress = true;
    try{
      const ok = await showConfirm('この固定費を削除しますか？（過去・今後すべての記録が消えます）');
      if(!ok) return;
      fixedCosts = fixedCosts.filter(f=>f.id!==editingFixedId);
      await saveFixedCosts();
      closeModalSafely('#fixedModalOverlay');
      render();
    } finally {
      fixedActionInProgress = false;
    }
  });

  if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }

  // ---------- 認証（画面なし・自動サインイン） ----------
  auth.onAuthStateChanged((user)=>{
    if(user){
      loadAll();
    } else {
      auth.signInAnonymously().catch((e)=>{ console.error(e); showToast('サーバーへの接続に失敗しました'); });
    }
  });
})();
</script>
</body>
</html>
